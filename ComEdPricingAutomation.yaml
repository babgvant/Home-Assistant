alias: EV - ComEd Price and Battery SOC Control
description: >
  Controls both EVSEs based on ComEd hourly electricity pricing
  and Helios battery SOC when solar charging mode is disabled.

  Solar charging mode takes priority. While enabled, this
  automation never changes either EVSE.

  Pauses charging when SOC <= 40% and hourly price > $0.15/kWh.
  Resumes charging when hourly price < $0.10/kWh.

  Between thresholds, maintains the previous charging state.

triggers:
  - trigger: state
    entity_id: sensor.comed_electricity_price
    id: price_changed

  - trigger: state
    entity_id: sensor.solark_battery_soc
    id: soc_changed

  - trigger: state
    entity_id: input_boolean.ev_solar_charging
    id: solar_mode_changed

  - trigger: time_pattern
    minutes: "/5"
    id: periodic_check

  - trigger: homeassistant
    event: start
    id: startup

conditions:
  - condition: template
    value_template: >
      {{ is_number(states('sensor.comed_electricity_price'))
         and is_number(states('sensor.solark_battery_soc')) }}

actions:
  - variables:
      hourly_price: >
        {{ states('sensor.comed_electricity_price') | float }}

      soc: >
        {{ states('sensor.solark_battery_soc') | float }}

      solar_mode: >
        {{ is_state('input_boolean.ev_solar_charging', 'on') }}

      auto_paused: >
        {{ is_state('input_boolean.evse_automatic_pause', 'on') }}

      price_high: >
        {{ soc <= 40 and hourly_price > 0.15 }}

      price_recovered: >
        {{ hourly_price < 0.10 }}

  # Solar mode owns EVSE control.
  # Do not modify either EVSE while solar mode is enabled.

  - condition: template
    value_template: "{{ not solar_mode }}"

  - choose:

      # -------------------------------------------------------
      # HIGH PRICE: Suspend both EVSEs
      # -------------------------------------------------------

      - conditions:
          - condition: template
            value_template: "{{ price_high }}"

        sequence:
          - if:
              - condition: template
                value_template: "{{ not auto_paused }}"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.evse_automatic_pause

              - action: notify.mobile_app_pixel_10_pro
                data:
                  title: EV Charging Paused
                  message: >
                    EV charging suspended due to ComEd pricing.

                    Hourly price: ${{ hourly_price | round(3) }}/kWh
                    Helios SOC: {{ soc | round(1) }}%

          - condition: state
            entity_id: input_boolean.ev_solar_charging
            state: "off"

          - action: switch.turn_off
            target:
              entity_id:
                - switch.p_base_48a
                - switch.garage_grizzl_e_charger_charging

      # -------------------------------------------------------
      # PRICE RECOVERY: Resume normal charging
      # -------------------------------------------------------

      - conditions:
          - condition: template
            value_template: >
              {{ auto_paused and price_recovered }}

        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.evse_automatic_pause

          - condition: state
            entity_id: input_boolean.ev_solar_charging
            state: "off"

          - action: switch.turn_on
            target:
              entity_id:
                - switch.p_base_48a
                - switch.garage_grizzl_e_charger_charging

          - action: notify.mobile_app_pixel_10_pro
            data:
              title: EV Charging Resumed
              message: >
                ComEd hourly pricing dropped below $0.10/kWh.
                Both EVSEs have been enabled.

                Hourly price: ${{ hourly_price | round(3) }}/kWh
                Helios SOC: {{ soc | round(1) }}%

      # -------------------------------------------------------
      # SOLAR MODE DISABLED: Restore normal EVSE control
      # -------------------------------------------------------

      - conditions:
          - condition: trigger
            id: solar_mode_changed

          - condition: state
            entity_id: input_boolean.ev_solar_charging
            state: "off"

          - condition: template
            value_template: >
              {{ not auto_paused or price_recovered }}

        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.evse_automatic_pause

          - action: switch.turn_on
            target:
              entity_id:
                - switch.p_base_48a
                - switch.garage_grizzl_e_charger_charging

mode: restart