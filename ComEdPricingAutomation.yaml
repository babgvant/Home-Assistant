alias: EV - ComEd Price and Battery SOC Control
description: >
  Controls the Emporia and Grizzl-E EVSEs together based on ComEd electricity
  pricing and Helios battery SOC. Pauses both EVSEs when pricing is high and
  battery SOC has reached reserve. Resumes both when pricing normalizes.

triggers:
  - trigger: state
    entity_id: sensor.comed_fast_price
    id: fast_price_changed

  - trigger: state
    entity_id: sensor.comed_electricity_price
    id: hourly_price_changed

  - trigger: state
    entity_id: sensor.solark_battery_soc
    id: soc_changed

  - trigger: state
    entity_id: switch.p_base_48a
    id: emporia_changed

  - trigger: state
    entity_id: switch.garage_grizzl_e_charger_charging
    id: grizzle_changed

  - trigger: time_pattern
    minutes: "6"
    id: resume_check

  - trigger: homeassistant
    event: start
    id: startup

conditions:
  - condition: template
    value_template: >
      {{ is_number(states('sensor.comed_fast_price'))
         and is_number(states('sensor.comed_electricity_price'))
         and is_number(states('sensor.solark_battery_soc')) }}

actions:
  - variables:
      fast_price: "{{ states('sensor.comed_fast_price') | float }}"
      hourly_price: "{{ states('sensor.comed_electricity_price') | float }}"
      soc: "{{ states('sensor.solark_battery_soc') | float }}"

      emporia_on: >
        {{ is_state('switch.p_base_48a', 'on') }}

      grizzle_on: >
        {{ is_state('switch.garage_grizzl_e_charger_charging', 'on') }}

      any_evse_on: >
        {{ emporia_on or grizzle_on }}

      auto_paused: >
        {{ is_state('input_boolean.evse_automatic_pause', 'on') }}

  - choose:

      # ============================================================
      # MANUAL OVERRIDE
      #
      # If either EVSE is manually turned back on while automatically
      # paused, treat that as an intentional override.
      #
      # Clear automatic pause and enable both chargers.
      # ============================================================

      - conditions:
          - condition: template
            value_template: >
              {{ auto_paused
                 and (
                   (trigger.id == 'emporia_changed' and emporia_on)
                   or
                   (trigger.id == 'grizzle_changed' and grizzle_on)
                 ) }}
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.evse_automatic_pause

          - action: switch.turn_on
            target:
              entity_id:
                - switch.p_base_48a
                - switch.garage_grizzl_e_charger_charging

          - action: notify.mobile_app_pixel_10_pro
            data:
              title: EV Charging Override
              message: >
                EV charging was enabled manually.
                Both EVSEs have been enabled and automatic pause was cleared.
                ComEd 5-min: ${{ fast_price | round(3) }}/kWh.
                Current hour avg: ${{ hourly_price | round(3) }}/kWh.
                Helios SOC: {{ soc | round(1) }}%.

      # ============================================================
      # PAUSE
      #
      # Pause when:
      #
      #   SOC <= 40%
      #
      # AND either:
      #
      #   current-hour average > $0.25/kWh
      #   OR
      #   latest 5-minute price > $0.50/kWh
      #
      # EVSE state-change triggers are deliberately excluded here so
      # a manual override is not immediately undone.
      # ============================================================

      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id in [
                   'fast_price_changed',
                   'hourly_price_changed',
                   'soc_changed',
                   'startup'
                 ]
                 and not auto_paused
                 and soc <= 40
                 and any_evse_on
                 and (
                   hourly_price > 0.25
                   or fast_price > 0.50
                 ) }}
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.evse_automatic_pause

          - action: notify.mobile_app_pixel_10_pro
            data:
              title: EV Charging Paused
              message: >
                Both EVSEs were paused.
                ComEd 5-min: ${{ fast_price | round(3) }}/kWh.
                Current hour avg: ${{ hourly_price | round(3) }}/kWh.
                Helios SOC: {{ soc | round(1) }}%.

          - action: switch.turn_off
            target:
              entity_id:
                - switch.p_base_48a
                - switch.garage_grizzl_e_charger_charging

      # ============================================================
      # RESUME
      #
      # Check at :06 each hour so the new hour has had time to get
      # fresh ComEd pricing data.
      #
      # Resume only if:
      #
      #   the automation previously paused charging
      #
      # AND
      #
      #   current-hour average < $0.20/kWh
      # ============================================================

      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id == 'resume_check'
                 and auto_paused
                 and hourly_price < 0.20 }}
        sequence:
          # Clear helper first so the resulting EVSE state changes are
          # not misinterpreted as manual overrides.
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.evse_automatic_pause

          - action: switch.turn_on
            target:
              entity_id:
                - switch.p_base_48a
                - switch.garage_grizzl_e_charger_charging

          - action: notify.mobile_app_pixel_10_pro
            data:
              title: EV Charging Resumed
              message: >
                Both EVSEs were enabled after ComEd pricing normalized.
                ComEd 5-min: ${{ fast_price | round(3) }}/kWh.
                Current hour avg: ${{ hourly_price | round(3) }}/kWh.
                Helios SOC: {{ soc | round(1) }}%.

mode: queued
max: 10