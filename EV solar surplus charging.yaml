alias: EV solar surplus charging
description: >-
  Solar-only Grizzl-E and Emporia allocation. One connected vehicle gets the
  surplus; two get 50/50 when both need charge OR both are complete. If only one
  is complete, reserve its minimum (Grizzl-E 7 A, Emporia 6 A) and give the
  remainder to the other. Grizzl-E completion uses Charging Complete. Emporia
  completion is inferred after Connected, enabled, current limit >=6 A and 0-100
  W consumption persist five minutes; it clears when these conditions cease.
  Inferred completion may also represent a vehicle waiting on its own schedule.
  Round down and respect each EVSE maximum. Preserve sampled total EV power on
  Sol-Ark balance packets, battery/import deductions, PV cap, five-minute normal
  start/stop dwell and ComEd handoff.
triggers:
  - trigger: state
    entity_id: input_boolean.ev_solar_charging
    to: 'on'
    id: enabled
  - trigger: state
    entity_id: input_boolean.ev_solar_charging
    to: 'off'
    id: disabled
  - trigger: time_pattern
    minutes: /1
    id: adjust
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: state
    entity_id: sensor.solark_pv_power
    attribute: energy_balance
    id: solar_update
  - trigger: template
    id: start_grizzl
    value_template: >-
      {{ is_state('input_boolean.ev_solar_charging','on') and
      is_state('switch.garage_grizzl_e_charger_charging','off') and
      (is_state('binary_sensor.grizzl_e_charger_pilot_connected','on')) and
      (states('sensor.ev_solar_grizzl_allocation') | int(0)) >=
      (state_attr('number.garage_grizzl_e_charger_current_limit','min') |
      int(7)) }}
    for: '00:05:00'
  - trigger: template
    id: stop_grizzl
    value_template: >-
      {{ is_state('input_boolean.ev_solar_charging','on') and
      is_state('switch.garage_grizzl_e_charger_charging','on') and
      (states('sensor.ev_solar_grizzl_allocation') | int(0)) <
      (state_attr('number.garage_grizzl_e_charger_current_limit','min') |
      int(7)) }}
    for: '00:05:00'
  - trigger: template
    id: start_emporia
    value_template: >-
      {{ is_state('input_boolean.ev_solar_charging','on') and
      is_state('switch.p_base_48a','off') and
      (states('sensor.p_base_48a_status') in ['Connected','Charging']) and
      (states('sensor.ev_solar_emporia_allocation') | int(0)) >=
      (state_attr('number.p_base_48a_current_limit','min') | int(6)) }}
    for: '00:05:00'
  - trigger: template
    id: stop_emporia
    value_template: >-
      {{ is_state('input_boolean.ev_solar_charging','on') and
      is_state('switch.p_base_48a','on') and
      (states('sensor.ev_solar_emporia_allocation') | int(0)) <
      (state_attr('number.p_base_48a_current_limit','min') | int(6)) }}
    for: '00:05:00'
  - trigger: state
    entity_id:
      - binary_sensor.grizzl_e_charger_pilot_connected
      - sensor.p_base_48a_status
      - sensor.grizzl_e_charger_state
      - binary_sensor.ev_solar_emporia_inferred_complete
    id: connection_changed
  - trigger: state
    entity_id:
      - sensor.ev_solar_grizzl_allocation
      - sensor.ev_solar_emporia_allocation
    id: allocation_changed
actions:
  - if:
      - condition: trigger
        id: solar_update
    then:
      - variables:
          ev_sample_w: >-
            {{ [states('sensor.grizzl_e_charger_power') | float(0), 0] | max +
            [states('sensor.p_base_48a_power') | float(0), 0] | max }}
      - delay:
          seconds: 2
      - action: input_number.set_value
        target:
          entity_id: input_number.ev_solar_sampled_ev_power
        data:
          value: '{{ [ev_sample_w | float(0), 30000] | min }}'
      - delay:
          milliseconds: 250
  - variables:
      connected_count: >-
        {{ (is_state('binary_sensor.grizzl_e_charger_pilot_connected','on') |
        int) + ((states('sensor.p_base_48a_status') in ['Connected','Charging'])
        | int) }}
      pv_share_amps: >-
        {{ (([states('sensor.solark_pv_power') | float(0), 0] | max /
        ([states('sensor.grizzl_e_charger_voltage') | float(0), 1] | max)) /
        ([connected_count | int(0), 1] | max)) | round(0,'floor') | int }}
      grizzl_min: >-
        {{ state_attr('number.garage_grizzl_e_charger_current_limit','min') |
        int(7) }}
      grizzl_max: >-
        {{ state_attr('number.garage_grizzl_e_charger_current_limit','max') |
        int(80) }}
      emporia_min: '{{ state_attr(''number.p_base_48a_current_limit'',''min'') | int(6) }}'
      emporia_max: '{{ state_attr(''number.p_base_48a_current_limit'',''max'') | int(48) }}'
      grizzl_amps: '{{ states(''sensor.ev_solar_grizzl_allocation'') | int(0) }}'
      emporia_amps: '{{ states(''sensor.ev_solar_emporia_allocation'') | int(0) }}'
  - if:
      - condition: trigger
        id: disabled
    then:
      - action: number.set_value
        target:
          entity_id: number.garage_grizzl_e_charger_current_limit
        data:
          value: '{{ grizzl_max | int }}'
      - action: number.set_value
        target:
          entity_id: number.p_base_48a_current_limit
        data:
          value: '{{ emporia_max | int }}'
      - stop: Solar mode disabled; ComEd automation handles charging state.
  - condition: state
    entity_id: input_boolean.ev_solar_charging
    state: 'on'
  - if:
      - condition: trigger
        id:
          - enabled
          - startup
    then:
      - action: switch.turn_off
        target:
          entity_id:
            - switch.garage_grizzl_e_charger_charging
            - switch.p_base_48a
      - stop: >-
          Reset both chargers; start after five minutes of sufficient allocated
          surplus.
  - alias: Keep completed Grizzl-E at its minimum pilot current
    if:
      - condition: state
        entity_id: binary_sensor.grizzl_e_charger_pilot_connected
        state: 'on'
      - condition: state
        entity_id: sensor.grizzl_e_charger_state
        state: Charging Complete
      - condition: state
        entity_id: binary_sensor.ev_solar_emporia_inferred_complete
        state: 'off'
    then:
      - action: number.set_value
        target:
          entity_id: number.garage_grizzl_e_charger_current_limit
        data:
          value: '{{ grizzl_min | int }}'
  - alias: Keep solely completed Emporia at its minimum pilot current
    if:
      - condition: state
        entity_id: binary_sensor.ev_solar_emporia_inferred_complete
        state: 'on'
      - condition: or
        conditions:
          - condition: state
            entity_id: binary_sensor.grizzl_e_charger_pilot_connected
            state: 'off'
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.grizzl_e_charger_state
                state: Charging Complete
    then:
      - action: number.set_value
        target:
          entity_id: number.p_base_48a_current_limit
        data:
          value: '{{ emporia_min | int }}'
  - alias: Reconcile grizzl before starting either charger
    choose:
      - conditions:
          - condition: or
            conditions:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: binary_sensor.grizzl_e_charger_pilot_connected
                    state: 'on'
              - condition: state
                entity_id: sensor.ev_solar_grizzl_allocation
                state:
                  - unavailable
                  - unknown
              - condition: numeric_state
                entity_id: sensor.solark_pv_power
                value_template: >-
                  {{ (state.state | float(0)) /
                  ([states('sensor.grizzl_e_charger_voltage') | float(0), 1] |
                  max) / ([connected_count | int(0), 1] | max) }}
                below: 7
              - condition: trigger
                id: stop_grizzl
              - condition: and
                conditions:
                  - condition: trigger
                    id: connection_changed
                  - condition: not
                    conditions:
                      - condition: numeric_state
                        entity_id: sensor.ev_solar_grizzl_allocation
                        above: 6
        sequence:
          - if:
              - condition: state
                entity_id: switch.garage_grizzl_e_charger_charging
                state: 'on'
            then:
              - action: switch.turn_off
                target:
                  entity_id: switch.garage_grizzl_e_charger_charging
      - conditions:
          - condition: state
            entity_id: switch.garage_grizzl_e_charger_charging
            state: 'on'
        sequence:
          - action: number.set_value
            target:
              entity_id: number.garage_grizzl_e_charger_current_limit
            data:
              value: >-
                {{ [[grizzl_amps | int(0), grizzl_max | int] | min, grizzl_min |
                int] | max }}
  - alias: Reconcile emporia before starting either charger
    choose:
      - conditions:
          - condition: or
            conditions:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: sensor.p_base_48a_status
                    state:
                      - Connected
                      - Charging
              - condition: state
                entity_id: sensor.ev_solar_emporia_allocation
                state:
                  - unavailable
                  - unknown
              - condition: numeric_state
                entity_id: sensor.solark_pv_power
                value_template: >-
                  {{ (state.state | float(0)) /
                  ([states('sensor.grizzl_e_charger_voltage') | float(0), 1] |
                  max) / ([connected_count | int(0), 1] | max) }}
                below: 6
              - condition: trigger
                id: stop_emporia
              - condition: and
                conditions:
                  - condition: trigger
                    id: connection_changed
                  - condition: not
                    conditions:
                      - condition: numeric_state
                        entity_id: sensor.ev_solar_emporia_allocation
                        above: 5
        sequence:
          - if:
              - condition: state
                entity_id: switch.p_base_48a
                state: 'on'
            then:
              - action: switch.turn_off
                target:
                  entity_id: switch.p_base_48a
      - conditions:
          - condition: state
            entity_id: switch.p_base_48a
            state: 'on'
        sequence:
          - action: number.set_value
            target:
              entity_id: number.p_base_48a_current_limit
            data:
              value: >-
                {{ [[emporia_amps | int(0), emporia_max | int] | min,
                emporia_min | int] | max }}
  - if:
      - condition: trigger
        id: start_grizzl
      - condition: state
        entity_id: binary_sensor.grizzl_e_charger_pilot_connected
        state: 'on'
      - condition: state
        entity_id: switch.garage_grizzl_e_charger_charging
        state: 'off'
      - condition: numeric_state
        entity_id: sensor.ev_solar_grizzl_allocation
        above: 6
    then:
      - action: number.set_value
        target:
          entity_id: number.garage_grizzl_e_charger_current_limit
        data:
          value: '{{ [grizzl_amps | int(0), grizzl_max | int] | min }}'
      - action: switch.turn_on
        target:
          entity_id: switch.garage_grizzl_e_charger_charging
  - if:
      - condition: trigger
        id: start_emporia
      - condition: state
        entity_id: sensor.p_base_48a_status
        state:
          - Connected
          - Charging
      - condition: state
        entity_id: switch.p_base_48a
        state: 'off'
      - condition: numeric_state
        entity_id: sensor.ev_solar_emporia_allocation
        above: 5
    then:
      - action: number.set_value
        target:
          entity_id: number.p_base_48a_current_limit
        data:
          value: '{{ [emporia_amps | int(0), emporia_max | int] | min }}'
      - action: switch.turn_on
        target:
          entity_id: switch.p_base_48a
mode: queued
max: 10
