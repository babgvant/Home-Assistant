alias: EV solar surplus charging
description: >-
  Solar-only Grizzl-E control. Sample EV power once when a new Sol-Ark
  energy-balance packet arrives, allow its entities to settle, then calculate
  the budget using that fixed EV sample. Never feed five-second charger changes
  back into five-minute site measurements. Apply current on each site packet and
  minute reconciliation; preserve PV power cap, battery/import deductions,
  five-minute start/stop delays, and ComEd handoff.
triggers:
  - trigger: state
    entity_id: input_boolean.ev_solar_charging
    to: 'on'
    id: enabled
  - trigger: state
    entity_id: input_boolean.ev_solar_charging
    to: 'off'
    id: disabled
  - trigger: template
    id: start
    value_template: >-
      {{ is_state('input_boolean.ev_solar_charging', 'on')

      and is_state('switch.garage_grizzl_e_charger_charging', 'off')

      and (states('sensor.ev_solar_available_current') | int(0))

      >= (state_attr('number.garage_grizzl_e_charger_current_limit', 'min') |
      int(7)) }}
    for: '00:05:00'
  - trigger: template
    id: stop
    value_template: >-
      {{ is_state('input_boolean.ev_solar_charging', 'on')

      and is_state('switch.garage_grizzl_e_charger_charging', 'on')

      and (states('sensor.ev_solar_available_current') | int(0))

      < (state_attr('number.garage_grizzl_e_charger_current_limit', 'min') |
      int(7)) }}
    for: '00:05:00'
  - trigger: time_pattern
    minutes: /1
    id: adjust
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: state
    entity_id: sensor.solark_pv_power
    attribute: energy_balance
    id: solar_update
actions:
  - if:
      - condition: trigger
        id: solar_update
    then:
      - variables:
          ev_sample_w: '{{ [states(''sensor.grizzl_e_charger_power'') | float(0), 0] | max }}'
      - delay:
          seconds: 2
      - action: input_number.set_value
        target:
          entity_id: input_number.ev_solar_sampled_ev_power
        data:
          value: '{{ [ev_sample_w | float(0), 30000] | min }}'
      - delay:
          milliseconds: 250
  - variables:
      min_amps: |
        {{ state_attr(
           'number.garage_grizzl_e_charger_current_limit', 'min') | int(7) }}
      max_amps: |
        {{ state_attr(
           'number.garage_grizzl_e_charger_current_limit', 'max') | int(32) }}
      avail_amps: '{{ states(''sensor.ev_solar_available_current'') | int(0) }}'
      pv_cap_amps: >-
        {{ ([states('sensor.solark_pv_power') | float(0), 0] | max /
        ([states('sensor.grizzl_e_charger_voltage') | float(0), 1] | max)) |
        round(0, 'floor') | int }}
  - choose:
      - conditions:
          - condition: trigger
            id:
              - enabled
              - startup
          - condition: state
            entity_id: input_boolean.ev_solar_charging
            state: 'on'
        sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.p_base_48a
          - action: switch.turn_off
            target:
              entity_id: switch.garage_grizzl_e_charger_charging
      - conditions:
          - condition: state
            entity_id: input_boolean.ev_solar_charging
            state: 'on'
          - condition: template
            value_template: >-
              {{ not is_number(states('sensor.ev_solar_available_current')) or
              (pv_cap_amps | int(0)) < (min_amps | int(7)) }}
        sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.garage_grizzl_e_charger_charging
      - conditions:
          - condition: trigger
            id: disabled
        sequence:
          - action: number.set_value
            target:
              entity_id: number.garage_grizzl_e_charger_current_limit
            data:
              value: '{{ max_amps | int }}'
      - conditions:
          - condition: trigger
            id: start
          - condition: state
            entity_id: input_boolean.ev_solar_charging
            state: 'on'
        sequence:
          - action: number.set_value
            target:
              entity_id: number.garage_grizzl_e_charger_current_limit
            data:
              value: >-
                {{ [[avail_amps | int(0), pv_cap_amps | int(0), max_amps |
                int(32)] | min, min_amps | int(7)] | max }}
          - action: switch.turn_on
            target:
              entity_id: switch.garage_grizzl_e_charger_charging
      - conditions:
          - condition: trigger
            id: stop
          - condition: state
            entity_id: input_boolean.ev_solar_charging
            state: 'on'
        sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.garage_grizzl_e_charger_charging
      - conditions:
          - condition: trigger
            id:
              - adjust
              - solar_update
          - condition: state
            entity_id: input_boolean.ev_solar_charging
            state: 'on'
          - condition: state
            entity_id: switch.garage_grizzl_e_charger_charging
            state: 'on'
        sequence:
          - action: number.set_value
            target:
              entity_id: number.garage_grizzl_e_charger_current_limit
            data:
              value: >-
                {{ [[avail_amps | int(0), pv_cap_amps | int(0), max_amps |
                int(32)] | min, min_amps | int(7)] | max }}
mode: restart
