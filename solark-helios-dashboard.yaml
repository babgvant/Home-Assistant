            color: amber
            vertical: false
          - type: tile
            entity: sensor.solark_energy_total
            name: Lifetime
            color: amber
            vertical: false
      - type: grid
        cards:
          - type: heading
            heading: Energy Summary
            icon: mdi:gauge
          - type: energy-self-sufficiency-gauge
            grid_options: {columns: 6, rows: 3}
          - type: energy-grid-neutrality-gauge
            grid_options: {columns: 6, rows: 3}
          - type: energy-sources-table
