title: Solar & Storage
views:
  - title: Overview
    path: overview
    icon: mdi:solar-power-variant
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Energy Flow
            icon: mdi:transmission-tower
          - type: energy-distribution
            link_dashboard: true
            grid_options: {columns: 12, rows: 5}

      - type: grid
        cards:
          - type: heading
            heading: Discover HELIOS Bank
            icon: mdi:battery-high
          - type: gauge
            entity: sensor.p_base_state_of_charge
            name: State of Charge
            min: 0
            max: 100
            needle: true
            severity: {red: 0, yellow: 40, green: 55}
            grid_options: {columns: 6, rows: auto}
          - type: tile
            entity: sensor.p_base_power_2
            name: Battery Power
            icon: mdi:battery-sync
            vertical: true
            grid_options: {columns: 6, rows: 3}
          - type: tile
            entity: device_tracker.lynk_ii
            name: LYNK II Network
            icon: mdi:lan-connect
            vertical: false
          - type: tile
            entity: sensor.p_base_battery_count
            name: Batteries Online
            icon: mdi:battery-multiple
            vertical: false
          - type: tile
            entity: sensor.p_base_alarm_count
            name: Active Alarms
            icon: mdi:alert-circle-outline
            color: red
            vertical: false
          - type: tile
            entity: sensor.p_base_lifetime_charge
            name: Lifetime Charge
            icon: mdi:battery-arrow-up
            vertical: false
          - type: tile
            entity: sensor.p_base_lifetime_discharge
            name: Lifetime Discharge
            icon: mdi:battery-arrow-down
            vertical: false
          - type: markdown
            content: >-
              **96 kWh HELIOS bank.** Yellow begins at the **40% operating
              reserve**. Negative battery power means charging; positive means
              discharging.
            grid_options: {columns: 12, rows: 2}

      - type: grid
        cards:
          - type: heading
            heading: Current Power
            icon: mdi:flash
          - type: tile
            entity: sensor.solark_pv_power
            name: Solar
            icon: mdi:solar-power-variant
            color: amber
            vertical: false
          - type: tile
            entity: sensor.solark_load_power
            name: Home
            icon: mdi:home-lightning-bolt
            color: blue
            vertical: false
          - type: tile
            entity: sensor.solark_grid_power_net
            name: Grid Net
            icon: mdi:transmission-tower
            color: purple
            vertical: false
          - type: tile
            entity: sensor.p_base_power_2
            name: Battery
            icon: mdi:battery-charging
            color: green
            vertical: false
          - type: tile
            entity: sensor.solark_grid_import_power
            name: Grid Import
            icon: mdi:transmission-tower-import
            color: red
            vertical: false
          - type: tile
            entity: sensor.solark_grid_export_power
            name: Grid Export
            icon: mdi:transmission-tower-export
            color: green
            vertical: false

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Power — Last 24 Hours
            icon: mdi:chart-line
          - type: history-graph
            hours_to_show: 24
            entities:
              - {entity: sensor.solark_pv_power, name: Solar}
              - {entity: sensor.solark_load_power, name: Home}
              - {entity: sensor.solark_grid_power_net, name: Grid Net}
              - {entity: sensor.p_base_power_2, name: HELIOS Bank}
            grid_options: {columns: 12, rows: 5}

      - type: grid
        cards:
          - type: heading
            heading: Production
            icon: mdi:solar-panel-large
          - type: tile
            entity: sensor.solark_energy_today
            name: Solar Energy Today
            icon: mdi:solar-power-variant
            color: amber
            vertical: false
          - type: tile
            entity: sensor.solark_energy_total
            name: Lifetime Solar Energy
            icon: mdi:counter
            color: amber
            vertical: false

      - type: grid
        cards:
          - type: heading
            heading: Battery SOC — Last 24 Hours
            icon: mdi:battery-clock
          - type: history-graph
            hours_to_show: 24
            entities:
              - {entity: sensor.p_base_state_of_charge, name: State of Charge}
            grid_options: {columns: 12, rows: 4}

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: HELIOS Battery Health
            icon: mdi:battery-heart-variant
          - type: entities
            title: Battery 2460061
            state_color: true
            show_header_toggle: false
            entities:
              - {entity: sensor.battery_dlphd48b252460061_state_of_charge, name: SOC}
              - {entity: sensor.battery_dlphd48b252460061_battery_temperature, name: Battery Temp}
              - {entity: sensor.battery_dlphd48b252460061_bms_temperature, name: BMS Temp}
              - {entity: sensor.battery_dlphd48b252460061_terminal_voltage, name: Voltage}
              - {entity: sensor.battery_dlphd48b252460061_current, name: Current}
              - {entity: sensor.battery_dlphd48b252460061_cell_spread, name: Cell Spread}
              - {entity: binary_sensor.battery_dlphd48b252460061_fault_or_warning, name: Fault / Warning}
            grid_options: {columns: 4, rows: 5}
          - type: entities
            title: Battery 2460084
            state_color: true
            show_header_toggle: false
            entities:
              - {entity: sensor.battery_dlphd48b252460084_state_of_charge, name: SOC}
