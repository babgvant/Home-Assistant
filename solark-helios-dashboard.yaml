  - title: System
    path: system
    icon: mdi:solar-power
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Plant Status
            icon: mdi:solar-power
          - type: tile
            entity: device_tracker.sol_ark_1
            name: Sol-Ark #1 Network
            icon: mdi:lan-connect
            vertical: false
          - type: tile
            entity: device_tracker.eese_d200_e4ak24c06502_lan
            name: Sol-Ark #2 Network
            icon: mdi:lan-connect
            vertical: false
          - type: tile
            entity: device_tracker.eese_d200_e4ak24c02364_lan
            name: Sol-Ark #3 Network
            icon: mdi:lan-connect
            vertical: false
          - type: tile
            entity: update.solark_cloud_update
            name: Sol-Ark Integration
            icon: mdi:cloud-sync-outline
            vertical: false

      - type: grid
        cards:
          - type: heading
            heading: HELIOS / LYNK II
            icon: mdi:battery-heart-variant
          - type: gauge
            entity: sensor.p_base_state_of_charge
            name: State of Charge
            min: 0
            max: 100
            needle: true
            severity: {red: 0, yellow: 40, green: 55}
            grid_options: {columns: 6, rows: auto}
          - type: tile
            entity: sensor.p_base_power_2
            name: Charge / Discharge
            icon: mdi:battery-sync
            vertical: true
            grid_options: {columns: 6, rows: 3}
          - type: tile
            entity: device_tracker.lynk_ii
            name: LYNK II Network
            icon: mdi:lan-connect
            vertical: false
          - type: tile
            entity: update.discover_energy_lynk_cloud_update
            name: LYNK Cloud Integration
            icon: mdi:update
            vertical: false
          - type: markdown
            content: >-
              Bank SOC and power are reported directly by Discover LYNK Cloud.
              The Sol-Ark-reported SOC is retained below only for comparison.
            grid_options: {columns: 12, rows: 2}

      - type: grid
        cards:
          - type: heading
            heading: Data Health
            icon: mdi:heart-pulse
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.solark_pv_power
                name: Solar data
                secondary_info: last-updated
              - entity: sensor.solark_load_power
                name: Load data
                secondary_info: last-updated
              - entity: sensor.solark_grid_power_net
                name: Grid data
                secondary_info: last-updated
              - entity: sensor.p_base_state_of_charge
                name: Battery data
                secondary_info: last-updated
              - entity: sensor.solark_battery_soc
                name: Sol-Ark SOC comparison
                secondary_info: last-updated
            grid_options: {columns: 12, rows: 5}
          - type: markdown
            content: >-
              Sol-Ark Cloud telemetry normally updates in approximately
              five-minute steps. Network presence comes from UniFi and does not
              prove that inverter or LYNK telemetry is healthy.
            grid_options: {columns: 12, rows: 2}
